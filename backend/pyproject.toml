[project]
name = "backend"
version = "0.1.0"
description = "Game Backlog feature"
authors = [
    {name = "Yash Chauhan",email = "yash.chauhanyrc@gmail.com"}
]
requires-python = "^3.12"
dependencies = [
    "fastapi (>=0.162.0,<0.163.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.17.3,<0.18.0)"
]
